name: Capture previews

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/capture-previews.mjs
      - .github/workflows/capture-previews.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-previews.mjs
      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update site previews"
          git push
